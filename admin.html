<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GDR CMS Admin</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body{
      font-family: Inter, sans-serif;
    }

    .sidebar-link.active{
      background:#166534;
      color:white;
    }

    .sidebar-link{
      transition:.2s;
    }

    .sidebar-link:hover{
      background:#f1f5f9;
    }
  </style>
</head>

<body class="bg-slate-100 text-slate-900">

<div id="loading-screen" class="fixed inset-0 z-50 grid place-items-center bg-white">
  <div class="text-center">
    <div class="mx-auto h-12 w-12 animate-spin rounded-full border-4 border-slate-200 border-t-green-700"></div>
    <p class="mt-4 text-sm font-bold text-slate-500">Loading CMS...</p>
  </div>
</div>

<div id="login-view" class="min-h-screen grid place-items-center p-6">

  <div class="w-full max-w-sm rounded-[32px] bg-white p-8 shadow-2xl">

    <div class="text-center">
      <img src="./assets/logo2.svg" class="mx-auto h-16 w-16">
      <h1 class="mt-5 text-3xl font-black">
        Admin CMS
      </h1>
      <p class="mt-2 text-sm text-slate-500">
        Grand Depok Residence
      </p>
    </div>

    <form id="login-form" class="mt-8 space-y-4">

      <input
        id="password"
        type="password"
        placeholder="Password"
        class="w-full rounded-2xl border border-slate-200 px-5 py-4 font-semibold outline-none focus:border-green-700"
      >

      <button
        type="submit"
        class="w-full rounded-2xl bg-green-700 py-4 font-bold text-white transition hover:bg-green-800"
      >
        Masuk
      </button>

    </form>

    <p id="login-error" class="mt-4 hidden rounded-2xl bg-red-50 p-4 text-sm font-bold text-red-700"></p>

  </div>

</div>

<div id="cms-view" class="hidden min-h-screen">

  <div class="flex">

    <!-- SIDEBAR -->

    <aside class="hidden w-[280px] shrink-0 border-r border-slate-200 bg-white lg:block">

      <div class="border-b border-slate-200 p-6">
        <div class="flex items-center gap-3">
          <img src="./assets/logo2.svg" class="h-12 w-12">
          <div>
            <h2 class="font-black">GDR CMS</h2>
            <p class="text-xs text-slate-400">
              Admin Panel
            </p>
          </div>
        </div>
      </div>

      <nav class="space-y-2 p-4">

        <button class="sidebar-link active w-full rounded-2xl px-4 py-3 text-left font-bold">
          Dashboard
        </button>

        <button class="sidebar-link w-full rounded-2xl px-4 py-3 text-left font-bold">
          Berita Warga
        </button>

        <button class="sidebar-link w-full rounded-2xl px-4 py-3 text-left font-bold">
          Hero Section
        </button>

        <button class="sidebar-link w-full rounded-2xl px-4 py-3 text-left font-bold">
          Tentang GDR
        </button>

        <button class="sidebar-link w-full rounded-2xl px-4 py-3 text-left font-bold">
          Fasilitas
        </button>

        <button class="sidebar-link w-full rounded-2xl px-4 py-3 text-left font-bold">
          Kegiatan
        </button>

        <button class="sidebar-link w-full rounded-2xl px-4 py-3 text-left font-bold">
          Mushola
        </button>

        <button class="sidebar-link w-full rounded-2xl px-4 py-3 text-left font-bold">
          Kontak
        </button>

      </nav>

      <div class="absolute bottom-0 w-[280px] border-t border-slate-200 p-4">

        <button
          id="logout-button"
          class="w-full rounded-2xl bg-slate-900 px-4 py-3 font-bold text-white"
        >
          Logout
        </button>

      </div>

    </aside>

    <!-- CONTENT -->

    <main class="min-h-screen flex-1 p-5 lg:p-8">

      <!-- TOPBAR -->

      <div class="flex flex-col gap-4 rounded-[32px] bg-white p-6 shadow-sm lg:flex-row lg:items-center lg:justify-between">

        <div>
          <p class="text-sm font-black uppercase tracking-[0.2em] text-green-700">
            Dashboard
          </p>

          <h1 class="mt-2 text-3xl font-black">
            GDR CMS Admin
          </h1>

          <p class="mt-2 text-sm text-slate-500">
            Kelola website Grand Depok Residence secara realtime.
          </p>
        </div>

        <a
          href="/"
          class="rounded-2xl border border-slate-200 px-5 py-3 text-center font-bold"
        >
          Lihat Website
        </a>

      </div>

      <!-- STATS -->

      <div class="mt-6 grid gap-4 md:grid-cols-2 xl:grid-cols-4">

        <div class="rounded-[28px] bg-white p-6 shadow-sm">
          <p class="text-sm font-bold text-slate-400">
            Pending
          </p>
          <h2 id="pending-count" class="mt-3 text-4xl font-black">
            0
          </h2>
        </div>

        <div class="rounded-[28px] bg-white p-6 shadow-sm">
          <p class="text-sm font-bold text-slate-400">
            Approved
          </p>
          <h2 id="approved-count" class="mt-3 text-4xl font-black">
            0
          </h2>
        </div>

        <div class="rounded-[28px] bg-white p-6 shadow-sm">
          <p class="text-sm font-bold text-slate-400">
            Rejected
          </p>
          <h2 id="rejected-count" class="mt-3 text-4xl font-black">
            0
          </h2>
        </div>

        <div class="rounded-[28px] bg-white p-6 shadow-sm">
          <p class="text-sm font-bold text-slate-400">
            Total Posts
          </p>
          <h2 id="total-count" class="mt-3 text-4xl font-black">
            0
          </h2>
        </div>

      </div>

      <!-- POSTS -->

      <section class="mt-6 rounded-[32px] bg-white p-6 shadow-sm">

        <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">

          <div>
            <h2 class="text-2xl font-black">
              Berita Warga
            </h2>

            <p class="mt-1 text-sm text-slate-500">
              Moderasi posting warga realtime.
            </p>
          </div>

          <button
            id="refresh-button"
            class="rounded-2xl border border-slate-200 px-5 py-3 font-bold"
          >
            Refresh
          </button>

        </div>

        <div
          id="posts-container"
          class="mt-6 grid gap-5"
        ></div>

      </section>

    </main>

  </div>

</div>

<script>

const SUPABASE_URL = "https://gyofijyebgtxzbtwlwbw.supabase.co";

const SUPABASE_ANON_KEY = "YOUR_ANON_KEY";

const ADMIN_EMAIL = "pixelcase@gmail.com";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const loadingScreen = document.getElementById("loading-screen");
const loginView = document.getElementById("login-view");
const cmsView = document.getElementById("cms-view");

const postsContainer = document.getElementById("posts-container");

async function checkSession(){

  const {
    data:{session}
  } = await supabaseClient.auth.getSession();

  if(
    session &&
    session.user.email === ADMIN_EMAIL
  ){
    showCMS();
    loadPosts();
  }else{
    showLogin();
  }

  loadingScreen.classList.add("hidden");
}

function showLogin(){
  loginView.classList.remove("hidden");
  cmsView.classList.add("hidden");
}

function showCMS(){
  loginView.classList.add("hidden");
  cmsView.classList.remove("hidden");
}

document
.getElementById("login-form")
.addEventListener("submit", async(e)=>{

  e.preventDefault();

  const password =
    document.getElementById("password").value;

  const loginError =
    document.getElementById("login-error");

  loginError.classList.add("hidden");

  const {data,error} =
    await supabaseClient.auth.signInWithPassword({
      email:ADMIN_EMAIL,
      password
    });

  if(error || !data.session){

    loginError.textContent =
      "Password salah.";

    loginError.classList.remove("hidden");

    return;
  }

  showCMS();

  loadPosts();

});

async function loadPosts(){

  const {data,error} =
    await supabaseClient
      .from("news_posts")
      .select("*")
      .order("created_at",{ascending:false});

  if(error){
    postsContainer.innerHTML = `
      <div class="rounded-3xl bg-red-50 p-5 text-red-700 font-bold">
        ${error.message}
      </div>
    `;
    return;
  }

  renderPosts(data || []);

}

function renderPosts(posts){

  document.getElementById("pending-count").textContent =
    posts.filter(p=>p.status==="pending").length;

  document.getElementById("approved-count").textContent =
    posts.filter(p=>p.status==="approved").length;

  document.getElementById("rejected-count").textContent =
    posts.filter(p=>p.status==="rejected").length;

  document.getElementById("total-count").textContent =
    posts.length;

  if(!posts.length){

    postsContainer.innerHTML = `
      <div class="rounded-3xl border border-dashed border-slate-300 p-10 text-center">
        <h3 class="text-2xl font-black">
          Belum ada posting.
        </h3>
      </div>
    `;

    return;
  }

  postsContainer.innerHTML =
    posts.map(post=>`

      <article class="grid gap-5 rounded-[28px] border border-slate-200 p-5 lg:grid-cols-[220px_1fr]">

        ${
          post.image_url
          ? `
            <img
              src="${post.image_url}"
              class="h-52 w-full rounded-3xl object-cover"
            >
          `
          : `
            <div class="grid h-52 place-items-center rounded-3xl bg-slate-100 text-sm font-bold text-slate-400">
              Tanpa Foto
            </div>
          `
        }

        <div>

          <div class="flex flex-wrap items-center gap-2">

            <span class="rounded-full bg-slate-100 px-3 py-1 text-xs font-black">
              ${post.category || "Berita"}
            </span>

            <span class="text-xs font-bold text-slate-400">
              ${new Date(post.created_at).toLocaleDateString("id-ID")}
            </span>

          </div>

          <h3 class="mt-4 text-2xl font-black">
            ${post.title}
          </h3>

          <p class="mt-3 whitespace-pre-line text-sm leading-7 text-slate-600">
            ${post.content}
          </p>

          <div class="mt-5 flex flex-wrap gap-2">

            ${
              post.status !== "approved"
              ? `
                <button
                  onclick="updatePost('${post.id}','approved')"
                  class="rounded-2xl bg-green-700 px-5 py-3 text-sm font-black text-white"
                >
                  Approve
                </button>
              `
              : ""
            }

            ${
              post.status !== "rejected"
              ? `
                <button
                  onclick="updatePost('${post.id}','rejected')"
                  class="rounded-2xl border border-red-200 px-5 py-3 text-sm font-black text-red-700"
                >
                  Reject
                </button>
              `
              : ""
            }

            <button
              onclick="deletePost('${post.id}')"
              class="rounded-2xl border border-slate-200 px-5 py-3 text-sm font-black"
            >
              Hapus
            </button>

          </div>

        </div>

      </article>

    `).join("");

}

async function updatePost(id,status){

  await supabaseClient
    .from("news_posts")
    .update({
      status
    })
    .eq("id",id);

  loadPosts();

}

async function deletePost(id){

  const confirmDelete =
    confirm("Hapus posting ini?");

  if(!confirmDelete) return;

  await supabaseClient
    .from("news_posts")
    .delete()
    .eq("id",id);

  loadPosts();

}

document
.getElementById("logout-button")
.addEventListener("click",async()=>{

  await supabaseClient.auth.signOut();

  location.reload();

});

document
.getElementById("refresh-button")
.addEventListener("click",loadPosts);

supabaseClient.auth.onAuthStateChange(
  async(event,session)=>{

    if(
      session &&
      session.user.email === ADMIN_EMAIL
    ){
      showCMS();
    }else{
      showLogin();
    }

  }
);

checkSession();

</script>

</body>
</html>
