<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Moderasi Berita - GDR Admin</title>
  <link rel="stylesheet" href="admin.css" />
  
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Browser Image Compression -->
  <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
  
  <style>
    /* Upload Foto Styles */
    .upload-section { 
      background: #f9fafb; 
      padding: 1.5rem; 
      border-radius: 0.5rem; 
      margin: 1.5rem 0;
      border: 2px dashed #d1d5db;
    }
    .upload-section.dragover {
      border-color: #3b82f6;
      background: #eff6ff;
    }
    .upload-preview { 
      max-width: 300px; 
      max-height: 200px; 
      object-fit: cover; 
      border-radius: 0.5rem; 
      margin-top: 1rem;
      display: none;
      border: 2px solid #e5e7eb;
    }
    .upload-preview.show { 
      display: block; 
    }
    .upload-progress { 
      display: none; 
      margin-top: 1rem; 
    }
    .upload-progress.active { 
      display: block; 
    }
    .progress-bar { 
      height: 6px; 
      background: #e5e7eb; 
      border-radius: 3px; 
      overflow: hidden; 
    }
    .progress-fill { 
      height: 100%; 
      background: linear-gradient(90deg, #3b82f6, #60a5fa); 
      width: 0%; 
      transition: width 0.2s ease; 
    }
    .edit-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .edit-modal.show {
      display: flex;
    }
    .edit-modal-content {
      background: white;
      padding: 2rem;
      border-radius: 0.75rem;
      max-width: 700px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: #374151;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #d1d5db;
      border-radius: 0.5rem;
      font-size: 1rem;
    }
    .form-group textarea {
      min-height: 150px;
      resize: vertical;
    }
    .btn-group {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }
    .btn-primary {
      background: #3b82f6;
      color: white;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-primary:hover {
      background: #2563eb;
    }
    .btn-secondary {
      background: #6b7280;
      color: white;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-secondary:hover {
      background: #4b5563;
    }
    .file-input-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
    }
    .file-input-wrapper input[type=file] {
      position: absolute;
      left: -9999px;
    }
    .file-input-label {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: #e0e7ff;
      color: #4338ca;
      border-radius: 0.5rem;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }
    .file-input-label:hover {
      background: #c7d2fe;
    }
  </style>
</head>
<body>
  <div id="dashboard-view">
    <aside class="sidebar">
      <h2>GDR Admin</h2>
      <button class="sidebar-btn" onclick="window.location.href='/admin'">📊 Dashboard</button>
      <button class="sidebar-btn active" onclick="window.location.href='/admin/berita'">📝 Moderasi Berita</button>
      <button class="sidebar-btn" onclick="window.location.href='/admin/agenda'">📅 Agenda</button>
      <button class="sidebar-btn" onclick="window.location.href='/admin/terms'">📋 Terms & Conditions</button>
      <button class="sidebar-btn logout" onclick="handleLogout()">🚪 Keluar</button>
    </aside>

    <main class="main-content">
      <div class="header">
        <h2>Moderasi Berita Warga</h2>
        <span id="user-email"></span>
      </div>

      <div class="card" style="margin-bottom: 2rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
          <h3>Berita Menunggu Persetujuan</h3>
          <button class="btn-primary" onclick="showAddBerita()">+ Tambah Berita Baru</button>
        </div>
        <div id="pending-list" class="loading">Memuat...</div>
      </div>

      <div class="card">
        <h3 style="margin-bottom: 1rem;">Berita Disetujui</h3>
        <div id="approved-list" class="loading">Memuat...</div>
      </div>
    </main>
  </div>

  <!-- Edit/Add Modal -->
  <div id="editModal" class="edit-modal">
    <div class="edit-modal-content">
      <h2 id="modalTitle" style="margin-bottom: 1.5rem;">Edit Berita</h2>
      
      <form id="editForm">
        <input type="hidden" id="editId">
        
        <div class="form-group">
          <label for="editJudul">Judul *</label>
          <input type="text" id="editJudul" required>
        </div>

        <div class="form-group">
          <label for="editKategori">Kategori *</label>
          <select id="editKategori" required>
            <option value="">Pilih Kategori</option>
            <option value="Umum">Umum</option>
            <option value="Kegiatan">Kegiatan</option>
            <option value="Pengumuman">Pengumuman</option>
            <option value="Informasi">Informasi</option>
            <option value="Lainnya">Lainnya</option>
          </select>
        </div>

        <div class="form-group">
          <label for="editIsi">Isi Berita *</label>
          <textarea id="editIsi" required></textarea>
        </div>

        <!-- UPLOAD FOTO SECTION -->
        <div class="upload-section" id="uploadSection">
          <label style="display: block; margin-bottom: 0.75rem; font-weight: 500;">📷 Foto Berita</label>
          
          <div class="file-input-wrapper">
            <input 
              type="file" 
              id="inputFotoBerita" 
              accept="image/jpeg,image/png,image/webp"
              onchange="handleFileSelect(event)"
            >
            <label for="inputFotoBerita" class="file-input-label">
              📁 Pilih File
            </label>
          </div>
          
          <span id="fileName" style="margin-left: 1rem; color: #6b7280; font-size: 0.875rem;"></span>
          
          <img id="previewFoto" class="upload-preview" alt="Preview foto">
          
          <div id="uploadProgress" class="upload-progress">
            <div style="display: flex; justify-content: space-between; font-size: 0.875rem; color: #6b7280; margin-bottom: 0.5rem;">
              <span id="uploadStatus">Mengompresi & uploading...</span>
              <span id="uploadPercent">0%</span>
            </div>
            <div class="progress-bar">
              <div id="progressFill" class="progress-fill"></div>
            </div>
          </div>
          
          <p style="color: #6b7280; font-size: 0.875rem; margin-top: 0.75rem;">
            💡 Maksimal 5MB. Foto akan dikompresi otomatis menjadi &lt;500KB.
          </p>
          
          <input type="hidden" id="fotoUrlValue">
        </div>
        <!-- END UPLOAD FOTO SECTION -->

        <div class="btn-group">
          <button type="submit" class="btn-primary">💾 Simpan</button>
          <button type="button" class="btn-secondary" onclick="closeEditModal()">Batal</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // ===== KONFIGURASI SUPABASE =====
    const SUPABASE_URL = 'https://gyofijyebgtxzbtwlwbw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5b2ZpanllYmd0eHpidHdsd2J3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2ODAzNDQsImV4cCI6MjA5NTI1NjM0NH0.4h8ZBSTHlJgag2V2Z-lSd_IgrcbcU5UmCfprzJpMQOo';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    let currentUploadedFile = null;

    // ===== AUTH CHECK =====
    window.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.href = '/admin';
        return;
      }
      document.getElementById('user-email').textContent = session.user.email;
      loadBerita();
    });

    // ===== LOAD BERITA =====
    async function loadBerita() {
      // Load pending
      const { data: pending } = await supabase
        .from('news_posts')
        .select('*')
        .eq('status', 'pending')
        .order('created_at', { ascending: false });

      // Load approved
      const { data: approved } = await supabase
        .from('news_posts')
        .select('*')
        .eq('status', 'approved')
        .order('created_at', { ascending: false });

      renderPending(pending || []);
      renderApproved(approved || []);
    }

    // ===== RENDER PENDING =====
    function renderPending(beritaList) {
      const container = document.getElementById('pending-list');
      if (beritaList.length === 0) {
        container.innerHTML = '<p style="color: #64748b;">Tidak ada berita menunggu</p>';
        return;
      }

      container.innerHTML = beritaList.map(berita => `
        <div style="border: 1px solid #e2e8f0; padding: 1rem; border-radius: 8px; margin-bottom: 1rem;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
            <strong>${berita.judul}</strong>
            <span style="background: #fbbf24; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem;">Pending</span>
          </div>
          <p style="color: #64748b; font-size: 0.875rem;">Pengirim: ${berita.nama_pengirim} | Kategori: ${berita.kategori}</p>
          <p style="margin: 0.5rem 0;">${berita.isi.substring(0,150)}...</p>
          ${berita.foto_url ? `<img src="${berita.foto_url}" style="max-width: 200px; max-height: 150px; object-fit: cover; border-radius: 4px; margin: 0.5rem 0;">` : ''}
          <div style="display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap;">
            <button class="btn" style="width: auto; padding: 0.5rem 1rem; background: #22c55e; color: white;" onclick="approveBerita('${berita.id}')">✓ Setujui</button>
            <button class="btn" style="width: auto; padding: 0.5rem 1rem; background: #3b82f6; color: white;" onclick="editBerita('${berita.id}')">✏️ Edit</button>
            <button class="btn" style="width: auto; padding: 0.5rem 1rem; background: #dc2626; color: white;" onclick="rejectBerita('${berita.id}')">✗ Tolak</button>
          </div>
        </div>
      `).join('');
    }

    // ===== RENDER APPROVED =====
    function renderApproved(beritaList) {
      const container = document.getElementById('approved-list');
      if (beritaList.length === 0) {
        container.innerHTML = '<p style="color: #64748b;">Belum ada berita disetujui</p>';
        return;
      }

      container.innerHTML = beritaList.map(berita => `
        <div style="border: 1px solid #e2e8f0; padding: 1rem; border-radius: 8px; margin-bottom: 1rem;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
            <strong>${berita.judul}</strong>
            <span style="background: #22c55e; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; color: white;">Published</span>
          </div>
          <p style="color: #64748b; font-size: 0.875rem;">Pengirim: ${berita.nama_pengirim} | Kategori: ${berita.kategori}</p>
          ${berita.foto_url ? `<img src="${berita.foto_url}" style="max-width: 200px; max-height: 150px; object-fit: cover; border-radius: 4px; margin: 0.5rem 0;">` : ''}
          <div style="display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap;">
            <button class="btn" style="width: auto; padding: 0.5rem 1rem; background: #3b82f6; color: white;" onclick="editBerita('${berita.id}')">✏️ Edit</button>
            <button class="btn" style="width: auto; padding: 0.5rem 1rem; background: #dc2626; color: white;" onclick="deleteBerita('${berita.id}')">🗑️ Hapus</button>
          </div>
        </div>
      `).join('');
    }

    // ===== UPLOAD FOTO FUNCTIONS =====
    
    // Handle file selection
    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      // Validasi tipe file
      if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
        alert('⚠️ Hanya format JPEG, PNG, atau WebP yang diperbolehkan');
        event.target.value = '';
        return;
      }
      
      // Validasi ukuran (max 5MB)
      if (file.size > 5 * 1024 * 1024) {
        alert('⚠️ Ukuran file maksimal 5MB');
        event.target.value = '';
        return;
      }
      
      currentUploadedFile = file;
      
      // Tampilkan nama file
      document.getElementById('fileName').textContent = file.name;
      
      // Preview image
      const reader = new FileReader();
      reader.onload = (e) => {
        const preview = document.getElementById('previewFoto');
        preview.src = e.target.result;
        preview.classList.add('show');
      };
      reader.readAsDataURL(file);
    }

    // Compress image
    async function compressImage(file) {
      const options = {
        maxSizeMB: 0.5,
        maxWidthOrHeight: 1920,
        useWebWorker: true,
        fileType: 'image/jpeg',
        quality: 0.8,
        initialQuality: 0.9
      };
      
      console.log('🗜️ Kompresi:', file.name, `(${(file.size/1024/1024).toFixed(2)}MB)`);
      const compressed = await imageCompression(file, options);
      console.log('✅ Hasil:', compressed.name, `(${(compressed.size/1024).toFixed(1)}KB)`);
      return compressed;
    }

    // Upload to Supabase Storage
    async function uploadToSupabase(file, beritaId = null) {
      const fileExt = file.name.split('.').pop().toLowerCase();
      const timestamp = Date.now();
      const randomStr = Math.random().toString(36).substr(2, 9);
      const fileName = beritaId 
        ? `berita-${beritaId}-${timestamp}.${fileExt}`
        : `berita-${timestamp}-${randomStr}.${fileExt}`;
      
      const { data, error } = await supabase
        .storage
        .from('berita-foto')
        .upload(fileName, file, {
          cacheControl: '3600',
          upsert: false,
          contentType: 'image/jpeg'
        });
      
      if (error) throw error;
      
      const { data: { publicUrl } } = supabase
        .storage
        .from('berita-foto')
        .getPublicUrl(fileName);
        
      return { success: true, url: publicUrl, path: fileName };
    }

    // Main upload handler
    async function handleFotoUpload(file, beritaId = null) {
      const progressEl = document.getElementById('uploadProgress');
      const fillEl = document.getElementById('progressFill');
      const percentEl = document.getElementById('uploadPercent');
      const statusEl = document.getElementById('uploadStatus');
      
      try {
        progressEl.classList.add('active');
        
        // Stage 1: Compress (30%)
        fillEl.style.width = '30%';
        percentEl.textContent = '30%';
        statusEl.textContent = 'Mengompresi gambar...';
        const compressed = await compressImage(file);
        
        // Stage 2: Upload (60% → 100%)
        fillEl.style.width = '60%';
        percentEl.textContent = '60%';
        statusEl.textContent = 'Uploading ke server...';
        const result = await uploadToSupabase(compressed, beritaId);
        
        fillEl.style.width = '100%';
        percentEl.textContent = '100%';
        statusEl.textContent = 'Upload selesai!';
        
        setTimeout(() => {
          progressEl.classList.remove('active');
          fillEl.style.width = '0%';
        }, 500);
        
        return result;
        
      } catch (err) {
        console.error('❌ Upload error:', err);
        progressEl.classList.remove('active');
        alert('❌ Gagal upload foto: ' + err.message);
        throw err;
      }
    }

    // ===== MODAL FUNCTIONS =====
    
    function showAddBerita() {
      document.getElementById('modalTitle').textContent = 'Tambah Berita Baru';
      document.getElementById('editForm').reset();
      document.getElementById('editId').value = '';
      document.getElementById('previewFoto').classList.remove('show');
      document.getElementById('fileName').textContent = '';
      document.getElementById('fotoUrlValue').value = '';
      currentUploadedFile = null;
      document.getElementById('editModal').classList.add('show');
    }

    async function editBerita(id) {
      const { data: berita } = await supabase
        .from('news_posts')
        .select('*')
        .eq('id', id)
        .single();
      
      if (!berita) {
        alert('Berita tidak ditemukan');
        return;
      }
      
      document.getElementById('modalTitle').textContent = 'Edit Berita';
      document.getElementById('editId').value = berita.id;
      document.getElementById('editJudul').value = berita.judul;
      document.getElementById('editKategori').value = berita.kategori;
      document.getElementById('editIsi').value = berita.isi;
      document.getElementById('fotoUrlValue').value = berita.foto_url || '';
      
      // Show existing photo if any
      const preview = document.getElementById('previewFoto');
      if (berita.foto_url) {
        preview.src = berita.foto_url;
        preview.classList.add('show');
        document.getElementById('fileName').textContent = 'Foto sudah ada';
      } else {
        preview.classList.remove('show');
        document.getElementById('fileName').textContent = '';
      }
      
      currentUploadedFile = null;
      document.getElementById('editModal').classList.add('show');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.remove('show');
      currentUploadedFile = null;
    }

    // ===== FORM SUBMIT =====
    document.getElementById('editForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const id = document.getElementById('editId').value;
      const judul = document.getElementById('editJudul').value;
      const kategori = document.getElementById('editKategori').value;
      const isi = document.getElementById('editIsi').value;
      let fotoUrl = document.getElementById('fotoUrlValue').value;
      
      try {
        // Jika ada file baru yang diupload
        if (currentUploadedFile) {
          const uploadResult = await handleFotoUpload(currentUploadedFile, id || null);
          fotoUrl = uploadResult.url;
        }
        
        const beritaData = {
          judul,
          kategori,
          isi,
          foto_url: fotoUrl,
          updated_at: new Date().toISOString()
        };
        
        if (id) {
          // Update existing
          const { error } = await supabase
            .from('news_posts')
            .update(beritaData)
            .eq('id', id);
          
          if (error) throw error;
          alert('✅ Berita berhasil diperbarui');
        } else {
          // Insert new
          const { data: { session } } = await supabase.auth.getSession();
          beritaData.nama_pengirim = session?.user?.email || 'Admin';
          beritaData.status = 'pending';
          beritaData.created_at = new Date().toISOString();
          
          const { error } = await supabase
            .from('news_posts')
            .insert(beritaData);
          
          if (error) throw error;
          alert('✅ Berita berhasil ditambahkan (status: pending)');
        }
        
        closeEditModal();
        loadBerita();
        
      } catch (err) {
        console.error('Error:', err);
        alert('❌ Gagal menyimpan: ' + err.message);
      }
    });

    // ===== CRUD FUNCTIONS =====
    
    async function approveBerita(id) {
      const { data: { session } } = await supabase.auth.getSession();
      const { error } = await supabase
        .from('news_posts')
        .update({
          status: 'approved',
          approved_by: session?.user?.email,
          approved_at: new Date().toISOString()
        })
        .eq('id', id);

      if (error) {
        alert('Error: ' + error.message);
      } else {
        loadBerita();
      }
    }

    async function rejectBerita(id) {
      if (!confirm('Tolak berita ini?')) return;
      
      const { error } = await supabase
        .from('news_posts')
        .update({ status: 'rejected' })
        .eq('id', id);
      
      if (error) {
        alert('Error: ' + error.message);
      } else {
        loadBerita();
      }
    }

    async function deleteBerita(id) {
      if (!confirm('Hapus berita ini secara permanen?')) return;
      
      const { error } = await supabase
        .from('news_posts')
        .delete()
        .eq('id', id);
      
      if (error) {
        alert('Error: ' + error.message);
      } else {
        loadBerita();
      }
    }

    async function handleLogout() {
      await supabase.auth.signOut();
      window.location.href = '/admin';
    }

    // Close modal when clicking outside
    document.getElementById('editModal').addEventListener('click', (e) => {
      if (e.target.id === 'editModal') {
        closeEditModal();
      }
    });
  </script>
</body>
</html>
