<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GDR CMS - Admin</title>
  <link rel="stylesheet" href="admin.css" />
  <!-- Load Supabase JS SEKALI saja -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- LOGIN VIEW -->
  <div id="auth-view" class="auth-container">
    <h1>GDR CMS</h1>
    <p>Masuk untuk kelola website.</p>
    <form id="login-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required />
      </div>
      <p id="login-error" class="error-msg"></p>
      <button type="submit" class="btn" id="login-btn">Masuk</button>
    </form>
  </div>

  <!-- DASHBOARD VIEW -->
  <div id="dashboard-view" class="hidden">
    <aside class="sidebar">
      <h2>GDR Admin</h2>
      <button class="sidebar-btn active" onclick="switchTab('dashboard')">📊 Dashboard</button>
      <button class="sidebar-btn" onclick="switchTab('content')">📝 Konten</button>
      <button class="sidebar-btn logout" onclick="handleLogout()">🚪 Keluar</button>
    </aside>
    <main class="main-content">
      <div class="header">
        <h2 id="page-title">Dashboard</h2>
        <span id="user-email"></span>
      </div>
      <section id="tab-dashboard" class="view-section active">
        <div class="card"><h3>Selamat Datang! 👋</h3></div>
      </section>
      <section id="tab-content" class="view-section">
        <div class="card"><h3>Konten</h3></div>
      </section>
    </main>
  </div>

  <!-- SCRIPT UTAMA - HANYA SATU KALI INISIALISASI -->
  <script>
    // ⚠️ GANTI DENGAN ANON KEY ASLI KAMU
    const SUPABASE_URL = 'https://gyofijyebgtxzbtwlwbw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5b2ZpanllYmd0eHpidHdsd2J3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2ODAzNDQsImV4cCI6MjA5NTI1NjM0NH0.4h8ZBSTHlJgag2V2Z-lSd_IgrcbcU5UmCfprzJpMQOo';
    
    // Inisialisasi Supabase - HANYA DI SINI
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // DOM Elements
    const authView = document.getElementById('auth-view');
    const dashboardView = document.getElementById('dashboard-view');
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');
    const loginBtn = document.getElementById('login-btn');
    const userEmailSpan = document.getElementById('user-email');

    // Cek sesi saat load
    window.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await _supabase.auth.getSession();
      if (session) showDashboard(session.user?.email);
      
      _supabase.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_IN' && session) showDashboard(session.user?.email);
        if (event === 'SIGNED_OUT') showLogin();
      });
    });

    // Login handler
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.textContent = '';
      loginBtn.disabled = true;
      loginBtn.textContent = 'Memproses...';

      const { data, error } = await _supabase.auth.signInWithPassword({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      });

      if (error) {
        loginError.textContent = 'Error: ' + error.message;
        loginBtn.disabled = false;
        loginBtn.textContent = 'Masuk';
      }
      // Jika sukses, onAuthStateChange handle sisanya
    });

    // Logout
    async function handleLogout() {
      await _supabase.auth.signOut();
      showLogin();
    }

    // UI Helpers
    function showDashboard(email) {
      authView.classList.add('hidden');
      dashboardView.classList.remove('hidden');
      userEmailSpan.textContent = email;
    }
    function showLogin() {
      dashboardView.classList.add('hidden');
      authView.classList.remove('hidden');
      loginForm.reset();
      loginBtn.disabled = false;
      loginBtn.textContent = 'Masuk';
    }
    function switchTab(tab) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.sidebar-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(`tab-${tab}`).classList.add('active');
      event.currentTarget.classList.add('active');
      document.getElementById('page-title').textContent = tab.charAt(0).toUpperCase() + tab.slice(1);
    }
  </script>
</body>
</html>
