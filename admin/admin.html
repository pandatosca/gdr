<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GDR CMS Admin</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="stylesheet" href="./admin.css">

</head>

<body class="bg-slate-100 text-slate-900">

<!-- LOADING -->

<div
  id="loading-screen"
  class="fixed inset-0 z-50 grid place-items-center bg-white"
>

  <div class="text-center">

    <div class="mx-auto h-14 w-14 animate-spin rounded-full border-4 border-slate-200 border-t-green-700"></div>

    <p class="mt-5 text-sm font-bold text-slate-500">
      Loading CMS...
    </p>

  </div>

</div>

<!-- LOGIN -->

<section
  id="login-view"
  class="grid min-h-screen place-items-center p-6"
>

  <div class="w-full max-w-sm rounded-[32px] bg-white p-8 shadow-2xl">

    <div class="text-center">

      <img
        src="../assets/logo2.svg"
        class="mx-auto h-16 w-16"
      >

      <h1 class="mt-5 text-3xl font-black">
        GDR CMS
      </h1>

      <p class="mt-2 text-sm text-slate-500">
        Grand Depok Residence
      </p>

    </div>

    <form
      id="login-form"
      class="mt-8 space-y-4"
    >

      <input
        id="password"
        type="password"
        placeholder="Password"
        class="w-full rounded-2xl border border-slate-200 px-5 py-4 font-semibold outline-none focus:border-green-700"
      >

      <button
        type="submit"
        class="w-full rounded-2xl bg-green-700 py-4 font-black text-white"
      >
        Masuk
      </button>

    </form>

    <p
      id="login-error"
      class="mt-4 hidden rounded-2xl bg-red-50 p-4 text-sm font-bold text-red-700"
    ></p>

  </div>

</section>

<!-- CMS -->

<section
  id="cms-view"
  class="hidden min-h-screen"
>

<div class="flex min-h-screen">

<!-- SIDEBAR -->

<aside class="hidden min-h-screen w-[280px] shrink-0 border-r border-slate-200 bg-white lg:flex lg:flex-col">

  <div class="border-b border-slate-200 p-6">

    <div class="flex items-center gap-3">

      <img
        src="../assets/logo2.svg"
        class="h-12 w-12"
      >

      <div>

        <h2 class="font-black">
          GDR CMS
        </h2>

        <p class="text-xs text-slate-400">
          Admin Panel
        </p>

      </div>

    </div>

  </div>

  <nav class="flex-1 space-y-2 p-4">

    <button class="sidebar-btn active w-full rounded-2xl px-4 py-3 text-left font-bold" data-view="dashboard">
      Dashboard
    </button>

    <button class="sidebar-btn w-full rounded-2xl px-4 py-3 text-left font-bold" data-view="hero">
      Hero
    </button>

    <button class="sidebar-btn w-full rounded-2xl px-4 py-3 text-left font-bold" data-view="fasilitas">
      Fasilitas
    </button>

    <button class="sidebar-btn w-full rounded-2xl px-4 py-3 text-left font-bold" data-view="kegiatan">
      Kegiatan
    </button>

    <button class="sidebar-btn w-full rounded-2xl px-4 py-3 text-left font-bold" data-view="mushola">
      Mushola
    </button>

    <button class="sidebar-btn w-full rounded-2xl px-4 py-3 text-left font-bold" data-view="kontak">
      Kontak
    </button>

  </nav>

  <div class="border-t border-slate-200 p-4">

    <button
      id="logout-button"
      class="w-full rounded-2xl bg-slate-900 px-4 py-3 font-black text-white"
    >
      Logout
    </button>

  </div>

</aside>

<!-- CONTENT -->

<main class="flex-1 p-5 lg:p-8">

  <!-- DASHBOARD -->

  <section
    class="view-section active"
    id="view-dashboard"
  >

    <div class="rounded-[32px] bg-white p-6 shadow-sm">

      <h1 class="text-3xl font-black">
        Dashboard
      </h1>

      <p class="mt-2 text-sm text-slate-500">
        Kelola website realtime.
      </p>

    </div>

    <div
      id="posts-container"
      class="mt-6 grid gap-5"
    ></div>

  </section>

  <!-- HERO -->

  <section
    class="view-section"
    id="view-hero"
  >

    <div id="hero-root"></div>

  </section>

  <!-- FASILITAS -->

  <section
    class="view-section"
    id="view-fasilitas"
  >

    <div id="facilities-root"></div>

  </section>

  <!-- KEGIATAN -->

  <section
    class="view-section"
    id="view-kegiatan"
  >

    <div id="activities-root"></div>

  </section>

  <!-- MUSHOLA -->

  <section
    class="view-section"
    id="view-mushola"
  >

    <div id="mushola-root"></div>

  </section>

  <!-- KONTAK -->

  <section
    class="view-section"
    id="view-kontak"
  >

    <div id="contact-root"></div>

  </section>

</main>

</div>

</section>

<script type="module" src="./admin.js"></script>

</body>
</html>
