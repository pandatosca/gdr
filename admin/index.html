<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin — GDR RT 09</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config/supabase.js"></script>
    <script src="../js/admin/auth.js"></script>
    <script src="../js/admin/posts.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --forest-950: #0a1f10;
        --forest-800: #164c2c;
        --forest-700: #1a5e35;
        --forest-100: #dcf0e4;
        --forest-50: #f0f9f4;
        --amber-400: #fbbf24;
        --amber-100: #fef3c7;
        --amber-800: #92400e;
        --red-100: #fee2e2;
        --red-600: #dc2626;
        --slate-50: #f8fafc;
        --slate-100: #f1f5f9;
        --slate-200: #e2e8f0;
        --slate-300: #cbd5e1;
        --slate-400: #94a3b8;
        --slate-500: #64748b;
        --slate-600: #475569;
        --slate-700: #334155;
        --slate-900: #0f172a;
        --radius: 16px;
        --sidebar-w: 240px;
      }
      body {
        font-family: system-ui, sans-serif;
        background: var(--slate-100);
        color: var(--slate-900);
        min-height: 100vh;
        display: flex;
      }

      /* SIDEBAR */
      .sidebar {
        width: var(--sidebar-w);
        min-height: 100vh;
        background: var(--forest-950);
        display: flex;
        flex-direction: column;
        padding: 1.5rem 1rem;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 40;
      }
      .sidebar-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 0.5rem 1.5rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        margin-bottom: 1.25rem;
      }
      .sidebar-brand .mark {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: white;
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }
      .sidebar-brand .mark svg {
        width: 24px;
        height: 24px;
      }
      .brand-name {
        font-size: 0.78rem;
        font-weight: 800;
        color: white;
        line-height: 1.2;
      }
      .brand-sub {
        font-size: 0.65rem;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.4);
        letter-spacing: 0.14em;
        margin-top: 1px;
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0.65rem 0.85rem;
        border-radius: 10px;
        font-size: 0.85rem;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.55);
        cursor: pointer;
        border: none;
        background: none;
        text-align: left;
        width: 100%;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .nav-item:hover {
        background: rgba(255, 255, 255, 0.07);
        color: white;
      }
      .nav-item.active {
        background: rgba(255, 255, 255, 0.12);
        color: white;
      }
      .nav-item .icon {
        font-size: 1rem;
        width: 20px;
        text-align: center;
      }
      .nav-badge {
        margin-left: auto;
        background: var(--amber-400);
        color: var(--forest-950);
        font-size: 0.65rem;
        font-weight: 800;
        padding: 2px 7px;
        border-radius: 20px;
        display: none;
      }
      .nav-badge.show {
        display: block;
      }
      .sidebar-footer {
        margin-top: auto;
        padding-top: 1rem;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      .logout-btn {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0.65rem 0.85rem;
        border-radius: 10px;
        font-size: 0.85rem;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.45);
        cursor: pointer;
        border: none;
        background: none;
        width: 100%;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .logout-btn:hover {
        background: rgba(220, 38, 38, 0.15);
        color: #fca5a5;
      }

      /* MAIN */
      .main {
        margin-left: var(--sidebar-w);
        flex: 1;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .topbar {
        background: white;
        border-bottom: 1px solid var(--slate-200);
        padding: 1rem 1.75rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 30;
      }
      .topbar h1 {
        font-size: 1.1rem;
        font-weight: 800;
      }
      .topbar-user {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .user-avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--forest-800);
        color: white;
        font-size: 0.8rem;
        font-weight: 800;
        display: grid;
        place-items: center;
      }
      .user-email {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--slate-500);
      }
      .content {
        padding: 1.75rem;
        flex: 1;
      }

      /* TABS */
      .tab-section {
        display: none;
      }
      .tab-section.active {
        display: block;
      }

      /* STATS */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 1rem;
        margin-bottom: 1.75rem;
      }
      .stat-card {
        background: white;
        border: 1px solid var(--slate-200);
        border-radius: var(--radius);
        padding: 1.25rem;
      }
      .stat-label {
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--slate-400);
      }
      .stat-value {
        font-size: 2rem;
        font-weight: 800;
        color: var(--forest-800);
        margin-top: 0.25rem;
        line-height: 1;
      }

      /* SECTION HEADER */
      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1rem;
      }
      .section-title {
        font-size: 1rem;
        font-weight: 800;
      }
      .refresh-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0.45rem 0.9rem;
        border-radius: 50px;
        border: 1px solid var(--slate-200);
        background: white;
        font-size: 0.78rem;
        font-weight: 700;
        color: var(--slate-600);
        cursor: pointer;
        transition: background 0.15s;
      }
      .refresh-btn:hover {
        background: var(--slate-50);
      }

      /* CARDS */
      .posts-list {
        display: grid;
        gap: 0.85rem;
      }
      .post-card {
        background: white;
        border: 1px solid var(--slate-200);
        border-radius: var(--radius);
        padding: 1.25rem 1.5rem;
        display: grid;
        gap: 0.75rem;
      }
      .post-meta {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        flex-wrap: wrap;
      }
      .badge {
        font-size: 0.68rem;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 20px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .badge-pending {
        background: var(--amber-100);
        color: var(--amber-800);
      }
      .badge-kegiatan {
        background: var(--forest-100);
        color: var(--forest-800);
      }
      .badge-berita {
        background: var(--slate-100);
        color: var(--slate-600);
      }
      .badge-dkm {
        background: #e0f2fe;
        color: #075985;
      }
      .badge-pengumuman {
        background: var(--amber-100);
        color: var(--amber-800);
      }
      .post-date {
        font-size: 0.75rem;
        color: var(--slate-400);
        font-weight: 500;
        margin-left: auto;
      }
      .post-title {
        font-size: 1rem;
        font-weight: 800;
        color: var(--slate-900);
        line-height: 1.3;
      }
      .post-body {
        font-size: 0.85rem;
        line-height: 1.7;
        color: var(--slate-600);
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .post-author {
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--slate-500);
      }
      .post-image {
        width: 100%;
        max-height: 220px;
        object-fit: cover;
        border-radius: 10px;
        border: 1px solid var(--slate-200);
      }
      .post-actions {
        display: flex;
        gap: 0.6rem;
        padding-top: 0.5rem;
        border-top: 1px solid var(--slate-100);
      }
      .btn {
        padding: 0.5rem 1.25rem;
        border-radius: 50px;
        font-size: 0.8rem;
        font-weight: 700;
        cursor: pointer;
        border: none;
        transition:
          opacity 0.15s,
          transform 0.1s;
      }
      .btn:hover {
        opacity: 0.88;
        transform: translateY(-1px);
      }
      .btn-approve {
        background: var(--forest-800);
        color: white;
      }
      .btn-delete {
        background: var(--red-100);
        color: var(--red-600);
      }

      /* EMPTY / SKELETON */
      .empty-state {
        text-align: center;
        padding: 3rem 1rem;
        background: white;
        border: 1.5px dashed var(--slate-200);
        border-radius: var(--radius);
        color: var(--slate-400);
        font-size: 0.9rem;
        font-weight: 600;
      }
      .empty-state .emoji {
        font-size: 2rem;
        display: block;
        margin-bottom: 0.75rem;
      }
      .skeleton {
        background: linear-gradient(
          90deg,
          var(--slate-100) 25%,
          var(--slate-200) 50%,
          var(--slate-100) 75%
        );
        background-size: 200% 100%;
        animation: shimmer 1.2s infinite;
        border-radius: 8px;
        height: 120px;
      }
      @keyframes shimmer {
        to {
          background-position: -200% 0;
        }
      }

      /* TOAST */
      #toast {
        position: fixed;
        bottom: 1.5rem;
        left: 50%;
        transform: translateX(-50%) translateY(8px);
        background: var(--slate-900);
        color: white;
        padding: 0.65rem 1.25rem;
        border-radius: 50px;
        font-size: 0.82rem;
        font-weight: 700;
        z-index: 999;
        opacity: 0;
        transition:
          opacity 0.2s,
          transform 0.2s;
        pointer-events: none;
        white-space: nowrap;
      }
      #toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      @media (max-width: 640px) {
        .sidebar {
          width: 200px;
        }
        .main {
          margin-left: 200px;
        }
        .content {
          padding: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="mark">
          <svg viewBox="0 0 61 60" fill="none">
            <path
              d="M51.5 29.07C42.4 28.64 24.47 29.72 24.47 45.28 24.47 50.47 37.11 49.82 51.5 29.07Z"
              fill="#164c2c"
            />
            <path
              d="M29.8 31.01C28.46 27.12 25.8 20.64 40.46 12.86 43.12 16.75 43.12 27.12 29.8 31.01Z"
              fill="#164c2c"
            />
            <path
              d="M24.47 36.2C17.8 36.2 7.94 25.05 13.81 14.15 19.8 16.54 32.46 25.83 24.47 36.2Z"
              fill="#164c2c"
            />
          </svg>
        </div>
        <div>
          <p class="brand-name">GDR Admin</p>
          <p class="brand-sub">RT 09 · RW 12</p>
        </div>
      </div>
      <nav class="nav">
        <button class="nav-item active" onclick="switchTab('dashboard', this)">
          <span class="icon">📊</span> Dashboard
        </button>
        <button class="nav-item" onclick="switchTab('pending', this)">
          <span class="icon">📝</span> Pending
          <span class="nav-badge" id="pending-badge">0</span>
        </button>
        <button class="nav-item" onclick="switchTab('approved', this)">
          <span class="icon">✅</span> Approved
        </button>
      </nav>
      <div class="sidebar-footer">
        <button class="logout-btn" onclick="logoutAdmin()">
          <span>🚪</span> Keluar
        </button>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <h1 id="page-title">Dashboard</h1>
        <div class="topbar-user">
          <div class="user-avatar" id="user-avatar">A</div>
          <span class="user-email" id="user-email"></span>
        </div>
      </div>

      <div class="content">
        <!-- DASHBOARD -->
        <section id="tab-dashboard" class="tab-section active">
          <div class="stats-grid">
            <div class="stat-card">
              <p class="stat-label">Pending</p>
              <p class="stat-value" id="stat-pending">—</p>
            </div>
            <div class="stat-card">
              <p class="stat-label">Approved</p>
              <p class="stat-value" id="stat-approved">—</p>
            </div>
            <div class="stat-card">
              <p class="stat-label">Total Post</p>
              <p class="stat-value" id="stat-total">—</p>
            </div>
          </div>
          <div class="section-header">
            <p class="section-title">Post Pending Terbaru</p>
          </div>
          <div id="dashboard-preview"></div>
        </section>

        <!-- PENDING -->
        <section id="tab-pending" class="tab-section">
          <div class="section-header">
            <p class="section-title">Menunggu Persetujuan</p>
            <button class="refresh-btn" onclick="refreshPending()">
              ↻ Refresh
            </button>
          </div>
          <div id="pending-posts" class="posts-list"></div>
        </section>

        <!-- APPROVED -->
        <section id="tab-approved" class="tab-section">
          <div class="section-header">
            <p class="section-title">Sudah Disetujui</p>
            <button class="refresh-btn" onclick="refreshApproved()">
              ↻ Refresh
            </button>
          </div>
          <div id="approved-posts" class="posts-list"></div>
        </section>
      </div>
    </div>

    <div id="toast"></div>

    <script>
      function showToast(msg, ms = 2500) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), ms);
      }

      function fmtDate(d) {
        if (!d) return "";
        return new Date(d).toLocaleDateString("id-ID", {
          day: "numeric",
          month: "short",
          year: "numeric",
        });
      }

      function badgeClass(cat) {
        return (
          {
            Pengumuman: "badge-pengumuman",
            Kegiatan: "badge-kegiatan",
            DKM: "badge-dkm",
            Berita: "badge-berita",
          }[cat] || "badge-berita"
        );
      }

      function renderCard(item, actions = true) {
        return `
          <div class="post-card" id="card-${item.id}">
            <div class="post-meta">
              <span class="badge ${badgeClass(item.category)}">${item.category || ""}</span>
              ${item.status === "pending" ? '<span class="badge badge-pending">Pending</span>' : ""}
              <span class="post-date">${fmtDate(item.created_at || item.date)}</span>
            </div>
            ${item.image_url ? `<img src="${item.image_url}" class="post-image" loading="lazy" alt=""/>` : ""}
            <p class="post-title">${item.title || ""}</p>
            <p class="post-body">${item.content || ""}</p>
            <p class="post-author">✍️ ${item.author || ""}</p>
            ${
              actions
                ? `
              <div class="post-actions">
                ${item.status === "pending" ? `<button class="btn btn-approve" onclick="handleApprove('${item.id}')">✓ Approve</button>` : ""}
                <button class="btn btn-delete" onclick="handleDelete('${item.id}')">✕ Hapus</button>
              </div>`
                : ""
            }
          </div>`;
      }

      function renderEmpty(msg) {
        return `<div class="empty-state"><span class="emoji">📭</span>${msg}</div>`;
      }

      function renderSkeleton() {
        return `<div class="post-card"><div class="skeleton"></div></div>`.repeat(
          3,
        );
      }

      const pageTitles = {
        dashboard: "Dashboard",
        pending: "Pending Posts",
        approved: "Approved Posts",
      };

      function switchTab(name, el) {
        document
          .querySelectorAll(".tab-section")
          .forEach((s) => s.classList.remove("active"));
        document
          .querySelectorAll(".nav-item")
          .forEach((b) => b.classList.remove("active"));
        document.getElementById(`tab-${name}`).classList.add("active");
        el.classList.add("active");
        document.getElementById("page-title").textContent =
          pageTitles[name] || name;
        if (name === "pending") refreshPending();
        if (name === "approved") refreshApproved();
      }

      async function loadStats() {
        const c = window.supabaseClient;
        const [{ count: p }, { count: a }, { count: tot }] = await Promise.all([
          c
            .from("news_posts")
            .select("*", { count: "exact", head: true })
            .eq("status", "pending"),
          c
            .from("news_posts")
            .select("*", { count: "exact", head: true })
            .eq("status", "approved"),
          c.from("news_posts").select("*", { count: "exact", head: true }),
        ]);
        document.getElementById("stat-pending").textContent = p ?? "—";
        document.getElementById("stat-approved").textContent = a ?? "—";
        document.getElementById("stat-total").textContent = tot ?? "—";
        const badge = document.getElementById("pending-badge");
        badge.textContent = p || 0;
        badge.classList.toggle("show", p > 0);
      }

      async function loadDashboardPreview() {
        const el = document.getElementById("dashboard-preview");
        el.innerHTML = renderSkeleton();
        const { data } = await window.supabaseClient
          .from("news_posts")
          .select("*")
          .eq("status", "pending")
          .order("created_at", { ascending: false })
          .limit(3);
        if (!data?.length) {
          el.innerHTML = renderEmpty("Tidak ada post pending. 🎉");
          return;
        }
        el.innerHTML = `<div class="posts-list">${data.map((i) => renderCard(i)).join("")}</div>`;
      }

      async function refreshPending() {
        const el = document.getElementById("pending-posts");
        el.innerHTML = renderSkeleton();
        const { data, error } = await window.supabaseClient
          .from("news_posts")
          .select("*")
          .eq("status", "pending")
          .order("created_at", { ascending: false });
        el.innerHTML =
          !data?.length || error
            ? renderEmpty("Tidak ada post pending.")
            : data.map((i) => renderCard(i)).join("");
      }

      async function refreshApproved() {
        const el = document.getElementById("approved-posts");
        el.innerHTML = renderSkeleton();
        const { data, error } = await window.supabaseClient
          .from("news_posts")
          .select("*")
          .eq("status", "approved")
          .order("created_at", { ascending: false });
        el.innerHTML =
          !data?.length || error
            ? renderEmpty("Belum ada post disetujui.")
            : data.map((i) => renderCard(i)).join("");
      }

      async function handleApprove(id) {
        const { error } = await window.supabaseClient
          .from("news_posts")
          .update({ status: "approved" })
          .eq("id", id);
        if (error) {
          showToast("Gagal: " + error.message);
          return;
        }
        document.getElementById(`card-${id}`)?.remove();
        showToast("✅ Post disetujui.");
        loadStats();
        loadDashboardPreview();
      }

      async function handleDelete(id) {
        if (!confirm("Hapus post ini permanen?")) return;
        const { error } = await window.supabaseClient
          .from("news_posts")
          .delete()
          .eq("id", id);
        if (error) {
          showToast("Gagal: " + error.message);
          return;
        }
        document.getElementById(`card-${id}`)?.remove();
        showToast("🗑️ Post dihapus.");
        loadStats();
      }

      async function initAdmin() {
        const session = await requireAdmin();
        if (!session) return;
        const email = session.user.email;
        document.getElementById("user-email").textContent = email;
        document.getElementById("user-avatar").textContent = email
          .charAt(0)
          .toUpperCase();
        await Promise.all([loadStats(), loadDashboardPreview()]);
      }

      initAdmin();
    </script>
  </body>
</html>
